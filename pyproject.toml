[project]
name = "hn-cli"
version = "0.1.0"
description = "Terminal-first Hacker News CLI reader"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "rich>=13.7",
]

[project.scripts]
hn = "hn_cli.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=7.4",
]

[tool.uv]
package = true
